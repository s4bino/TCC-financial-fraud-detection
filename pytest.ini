[pytest]
testpaths = tests

# Os módulos de src/ importam uns aos outros por nome simples
# (import cross_validation, from grid_search import *), o que exige que cada
# diretório esteja no sys.path — como ocorre quando os scripts são executados
# diretamente.
pythonpath =
    src/preprocessing
    src/models

addopts =
    -ra
    --strict-markers
    --showlocals

markers =
    slow: testes que treinam modelos e levam mais tempo que os demais
